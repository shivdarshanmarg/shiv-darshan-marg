<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Shiv Darshan Marg - Jaap Counter</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --gold: #f59e0b;
      --saffron: #ea580c;
      --text: #f3f4f6;
      --subtext: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      justify-content: space-between;
      padding: 24px 16px;
      user-select: none;
    }
    header { text-align: center; }
    h1 { color: var(--gold); font-size: 24px; letter-spacing: 1px; }
    .subtitle { color: var(--subtext); font-size: 14px; margin-top: 4px; }
    .community-box {
      background: var(--card);
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 12px 24px;
      text-align: center;
      width: 100%;
      max-width: 320px;
    }
    .community-box span { font-size: 12px; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; }
    .community-total { font-size: 26px; font-weight: bold; color: var(--gold); margin-top: 4px; }
    .counter-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .mala-badge {
      font-size: 15px;
      font-weight: 600;
      color: var(--saffron);
      background: rgba(234, 88, 12, 0.1);
      padding: 4px 16px;
      border-radius: 20px;
      margin-bottom: 20px;
      border: 1px solid rgba(234, 88, 12, 0.2);
    }
    .tap-btn {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, #2d261e 0%, #15161a 100%);
      border: 4px solid var(--gold);
      box-shadow: 0 0 25px rgba(245, 158, 11, 0.25);
      color: var(--text);
      font-size: 42px;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.08s ease;
    }
    .tap-btn:active {
      transform: scale(0.95);
      border-color: var(--saffron);
      box-shadow: 0 0 35px rgba(234, 88, 12, 0.4);
    }
    .tap-btn .label { font-size: 12px; color: var(--subtext); font-weight: normal; margin-top: 4px; }
    .controls { display: flex; gap: 12px; width: 100%; max-width: 320px; }
    button.btn {
      flex: 1;
      padding: 12px;
      background: var(--card);
      border: 1px solid #27272a;
      color: var(--text);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>🔱 SHIV DARSHAN MARG</h1>
    <p class="subtitle">ॐ नमः शिवाय • Akhand Jaap</p>
  </header>

  <div class="community-box">
    <span>Sangathana Chants</span>
    <div class="community-total" id="globalDisplay">0</div>
  </div>

  <div class="counter-container">
    <div class="mala-badge" id="malaDisplay">Mala: 0</div>
    <div class="tap-btn" id="tapBtn">
      <span id="beadDisplay">0</span>
      <span class="label">TAP TO CHANT</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="resetCurrentBeads()">Reset Current</button>
    <button class="btn" onclick="toggleVibration()" id="vibBtn">Vibrate: ON</button>
  </div>

  <script>
    // --- REPLACE THESE TWO LINES WITH YOUR REAL SUPABASE KEYS ---
    const SUPABASE_URL = 'PASTE_YOUR_SUPABASE_URL_HERE';
    const SUPABASE_ANON_KEY = 'PASTE_YOUR_ANON_KEY_HERE';
    // -------------------------------------------------------------

    let db = null;
    if (SUPABASE_URL !== 'https://gmnpazahpvqjwljcbzpy.supabase.co' && SUPABASE_ANON_KEY !== 'sb_publishable_eaMK-kuedvfs2g_8hVt7mg__TIHz7ZH') {
      try {
        db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } catch (err) {
        console.error("Supabase init error:", err);
      }
    }

    let beads = parseInt(localStorage.getItem('sdm_beads')) || 0;
    let malas = parseInt(localStorage.getItem('sdm_malas')) || 0;
    let localGlobal = parseInt(localStorage.getItem('sdm_local_global')) || 0;
    let vibrateEnabled = true;

    const beadEl = document.getElementById('beadDisplay');
    const malaEl = document.getElementById('malaDisplay');
    const globalEl = document.getElementById('globalDisplay');
    const tapBtn = document.getElementById('tapBtn');

    function updateLocalUI() {
      beadEl.innerText = beads;
      malaEl.innerText = `Mala: ${malas}`;
      if (!db) {
        globalEl.innerText = localGlobal.toLocaleString('en-IN');
      }
    }

    async function fetchTotalChants() {
      if (!db) return;
      try {
        const { data, error } = await db.from('jaap_counter').select('total_chants').eq('id', 1).single();
        if (data && !error) {
          globalEl.innerText = Number(data.total_chants).toLocaleString('en-IN');
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function doChant() {
      beads++;
      localGlobal++;

      if (vibrateEnabled && navigator.vibrate) {
        navigator.vibrate(40);
      }

      if (beads >= 108) {
        beads = 0;
        malas++;
        if (vibrateEnabled && navigator.vibrate) {
          navigator.vibrate([100, 60, 100]);
        }
      }

      localStorage.setItem('sdm_beads', beads);
      localStorage.setItem('sdm_malas', malas);
      localStorage.setItem('sdm_local_global', localGlobal);
      updateLocalUI();

      // Cloud Sync
      if (db) {
        try {
          const { data } = await db.from('jaap_counter').select('total_chants').eq('id', 1).single();
          if (data) {
            await db.from('jaap_counter').update({ total_chants: data.total_chants + 1 }).eq('id', 1);
          }
        } catch (e) {
          console.error(e);
        }
      }
    }

    function resetCurrentBeads() {
      if (confirm("Reset current bead count to 0?")) {
        beads = 0;
        localStorage.setItem('sdm_beads', 0);
        updateLocalUI();
      }
    }

    function toggleVibration() {
      vibrateEnabled = !vibrateEnabled;
      document.getElementById('vibBtn').innerText = `Vibrate: ${vibrateEnabled ? 'ON' : 'OFF'}`;
    }

    if (db) {
      db.channel('public:jaap_counter')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'jaap_counter' }, payload => {
          if (payload && payload.new) {
            globalEl.innerText = Number(payload.new.total_chants).toLocaleString('en-IN');
          }
        })
        .subscribe();
      fetchTotalChants();
    }

    tapBtn.addEventListener('click', doChant);
    updateLocalUI();
  </script>
</body>
</html>
